<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>작업대 — 우수리미</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="도구 50개를 한 화면에서 찾아 바로 엽니다." />
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#15171b; --dim:#69717d; --faint:#9aa2ad;
    --line:#e3e7ec; --line-soft:#eef1f5;
    --brand:#0b8f4d; --brand-soft:#e8f6ee;
    --amber:#9a6b14; --amber-soft:#fbf1dd;
    --slate:#5b6472; --slate-soft:#eaedf2;
    --hit:#fff6cc;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111317; --panel:#1a1d22; --ink:#eef0f3; --dim:#99a1ac; --faint:#6d757f;
      --line:#282d34; --line-soft:#21252b;
      --brand:#34c47e; --brand-soft:#12291d;
      --amber:#dda13f; --amber-soft:#2c2411;
      --slate:#97a0ac; --slate-soft:#23272e;
      --hit:#3d3512;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  a{color:inherit; text-decoration:none}

  /* ── 상단 고정 명령줄 ───────────────────────────── */
  .bar{
    position:sticky; top:0; z-index:20;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .bar-in{max-width:1080px; margin:0 auto; padding:12px 16px}
  .brandline{display:flex; align-items:baseline; gap:9px; margin-bottom:9px}
  .brandline b{font-size:15px; letter-spacing:-.01em}
  .brandline span{font-size:12px; color:var(--faint)}
  .field{position:relative; display:flex; align-items:center}
  .field input{
    width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:var(--bg); border:1.5px solid var(--line); border-radius:var(--r);
    padding:11px 84px 11px 38px; outline:none;
  }
  .field input:focus{border-color:var(--brand); background:var(--panel)}
  .field input::placeholder{color:var(--faint)}
  .field .mag{position:absolute; left:13px; color:var(--faint); font-size:15px; pointer-events:none}
  .field .kbd{
    position:absolute; right:11px; display:flex; gap:4px; align-items:center;
    font-size:11px; color:var(--faint); pointer-events:none;
  }
  .field .kbd i{
    font-style:normal; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:4px; padding:1px 5px; background:var(--bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .chips{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; align-items:center}
  .chip{
    font-size:12.5px; padding:4px 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--dim);
    user-select:none;
  }
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--panel)}
  .chip:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .tally{margin-left:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}

  /* ── 본문 2단 ──────────────────────────────────── */
  .page{max-width:1080px; margin:0 auto; padding:18px 16px 72px; display:grid; gap:22px;
        grid-template-columns:150px 1fr}
  .rail{position:sticky; top:132px; align-self:start}
  .rail button{
    display:flex; width:100%; justify-content:space-between; align-items:center; gap:8px;
    background:none; border:0; font:inherit; font-size:13px; color:var(--dim);
    padding:5px 8px; border-radius:7px; cursor:pointer; text-align:left;
  }
  .rail button:hover{background:var(--line-soft); color:var(--ink)}
  .rail button em{font-style:normal; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
  .rail button:focus-visible{outline:2px solid var(--brand); outline-offset:1px}

  h2.g{
    margin:22px 0 7px; font-size:12px; font-weight:700; letter-spacing:.06em;
    color:var(--faint); text-transform:uppercase;
  }
  h2.g:first-child{margin-top:0}

  /* ── 도구 행 ───────────────────────────────────── */
  .rows{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .row{
    display:flex; align-items:center; gap:11px; padding:9px 13px;
    border-top:1px solid var(--line-soft); cursor:pointer;
  }
  .rows .row:first-child{border-top:0}
  .row:hover,.row.on{background:var(--line-soft)}
  .row.on{box-shadow:inset 2px 0 0 var(--brand)}
  .row .nm{font-weight:600; white-space:nowrap}
  .row .ds{color:var(--dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .row .go{color:var(--faint); font-size:13px}
  .row[data-dead="1"]{cursor:default}
  .row[data-dead="1"] .go{display:none}
  mark{background:var(--hit); color:inherit; border-radius:2px; padding:0 1px}

  .tag{
    font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.01em;
  }
  .tag.zero{background:var(--brand-soft); color:var(--brand)}
  .tag.credit{background:var(--amber-soft); color:var(--amber)}
  .tag.boss{background:var(--slate-soft); color:var(--slate)}

  .empty{padding:34px 16px; text-align:center; color:var(--dim)}
  .empty b{display:block; color:var(--ink); margin-bottom:4px}

  .note{
    margin-top:20px; font-size:12.5px; color:var(--dim);
    border-left:2px solid var(--line); padding:2px 0 2px 11px;
  }

  @media (max-width:780px){
    .page{grid-template-columns:1fr; padding-top:14px}
    .rail{position:static; display:flex; gap:5px; overflow-x:auto; padding-bottom:4px;
          scrollbar-width:none; -ms-overflow-style:none}
    .rail::-webkit-scrollbar{display:none}
    .rail button{width:auto; white-space:nowrap; border:1px solid var(--line); padding:4px 10px}
    .rail button em{display:none}
    .field .kbd{display:none}
    .field input{padding-right:14px}
    .row .ds{display:none}
    .row .nm{white-space:normal}
  }
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background .1s ease}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brandline"><b>작업대</b><span>우수리미 도구 50개</span></div>
    <div class="field">
      <span class="mag">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="뭘 하시려고요? — 진단, 썸네일, 키워드, 발행…" aria-label="도구 검색" />
      <span class="kbd"><i>/</i> 검색 <i>↵</i> 열기</span>
    </div>
    <div class="chips" role="group" aria-label="거르기">
      <button class="chip" data-f="all" aria-pressed="true">전체</button>
      <button class="chip" data-f="zero" aria-pressed="false">원가 0</button>
      <button class="chip" data-f="credit" aria-pressed="false">크레딧</button>
      <button class="chip" data-f="boss" aria-pressed="false">사장님 전용</button>
      <span class="tally" id="tally"></span>
    </div>
  </div>
</div>

<div class="page">
  <nav class="rail" id="rail" aria-label="묶음"></nav>
  <main id="list"></main>
</div>

<script>
/* 도구 한 줄 = [이름, 설명, 주소(없으면 빈칸), 묶음, 비용(z=원가0 c=크레딧), 사장님전용]
   ⚠️ 주소가 빈칸인 것은 아직 단독 화면이 없는 기능입니다. 클릭해도 안 움직입니다. */
var G = ["진단","키워드","글 다듬기","썸네일","숏폼","발행","수익화","AI 원고","알림","사장님 전용"];
var T = [
["블로그 지수 진단","방문자·발행주기·검색노출을 재서 체급을 매깁니다","/blog-index.html",0,"z",0],
["홈판 노출 진단","블로그 홈에 걸릴 조건을 항목별로 점검합니다","/homefeed.html",0,"z",0],
["글 노출·누락 확인","쓴 글이 검색에서 빠졌는지 한 편씩 확인합니다","/check.html",0,"z",0],
["경쟁 글 비교","상위 글 5편을 가져와 내 글과 나란히 놓습니다","/compare.html",0,"z",0],
["순위 추적","등록해두면 매일 자동으로 순위를 재고 기록합니다","/rank.html",0,"z",0],

["키워드 분석","검색량·경쟁강도·문서수를 한 번에 봅니다","",1,"z",0],
["경쟁 키워드 찾기","누가 그 키워드를 먹고 있는지, 체급은 얼마인지","",1,"z",0],
["기회 키워드","검색은 있는데 좋은 글이 없는 자리를 골라냅니다","/opportunity.html",1,"z",0],
["주제 추천","내 주제에 맞으면서 지금 뜨는 소재를 뽑습니다","/suggest.html",1,"z",0],
["플레이스 순위","지역 업체는 검색이 아니라 지도에서 잡힙니다","",1,"z",0],

["줄바꿈 정리","모바일에서 읽히는 호흡으로 문단을 끊습니다","/linebreak.html",2,"z",0],
["맞춤법 검사","블로그 글에서 실제로 자주 나는 오타 위주로","/spell.html",2,"z",0],
["강조 넣기","굵게·색·인용을 어디에 넣을지 표시합니다","",2,"z",0],
["제목 실험실","상위 노출 제목의 패턴과 내 제목을 비교합니다","",2,"z",0],
["글 점검","글자수·이미지수·키워드 밀도를 발행 전에","",2,"z",0],
["주제 순도","주제가 얼마나 섞였는지 잽니다. 섞이면 지수가 흔들립니다","",2,"z",0],

["홈판 썸네일","홈판에 걸리는 규격과 패턴대로 만듭니다","/thumb.html",3,"z",0],
["썸네일 전략","상위 썸네일들이 공통으로 쓰는 구도를 뽑습니다","",3,"z",0],
["카드뉴스","글 하나를 인스타·스레드용 카드 묶음으로","/card-news.html",3,"c",0],
["브랜드 키트","색·폰트·로고를 정해두면 결과물 톤이 통일됩니다","/brand.html",3,"z",0],

["숏폼 기획·제작","주제만 주면 대본·자막·BGM·화면까지 짭니다","/shortform.html",4,"c",0],
["롱폼 → 숏츠","긴 영상에서 터질 구간을 찾아 세로로 자릅니다","/long-to-shorts.html",4,"c",1],
["사주 릴스","사주·운세 소재 릴스를 묶음으로 뽑습니다","/saju-reels.html",4,"c",1],
["네이버 클립 자막","클립 규격에 맞는 자막을 만들어 붙입니다","",4,"z",0],
["유튜브 소재 찾기","내 주제에서 지금 조회수가 도는 영상을 찾습니다","/youtube-finder.html",4,"z",0],

["크롬 확장프로그램","네이버 에디터에 바로 붙습니다. 복붙 사고가 없습니다","/extension.html",5,"z",0],
["네이버 블로그 발행","서식·이미지·태그를 유지한 채 올립니다","/publish.html",5,"z",1],
["인스타그램 발행","계정을 연결해두면 예약 발행까지 됩니다","",5,"z",0],
["스레드 발행","스레드 계정 연결 후 바로 게시합니다","",5,"z",0],
["한 번에 여러 곳","같은 글을 채널별 형식에 맞춰 동시에 내보냅니다","",5,"z",0],

["쿠팡 파트너스","상품을 찾아 제휴 링크를 만들어 글에 넣습니다","",6,"z",0],
["스레드 상품 소개","상품 링크만 주면 소개글과 사진을 뽑습니다","/thread-shop.html",6,"c",1],
["연예인·이슈 소재","지금 검색이 몰리는 인물과 이슈","/celeb.html",6,"z",0],
["대행사 리포트","고객사에 보낼 순위·노출 리포트를 자동으로","",6,"z",0],

["원고 초안","주제와 키워드를 주면 구성을 잡아 씁니다","/blog-writer.html",7,"c",0],
["본문 다시 쓰기","있는 글의 톤을 바꾸거나 길이를 조절합니다","",7,"c",0],
["제목 다시 쓰기","같은 내용으로 제목 후보를 여러 개 뽑습니다","",7,"c",0],
["프롬프트 스튜디오","검증된 프롬프트를 골라 바로 돌립니다","/prompt-studio.html",7,"c",1],

["순위 하락 알림","추적 중인 키워드가 밀리면 알려줍니다","",8,"z",0],
["글 누락 알림","검색에서 글이 빠지면 바로. 늦게 알면 손해가 큽니다","",8,"z",0],
["기회 키워드 알림","내 주제에 새 빈자리가 생기면 알려줍니다","",8,"z",0],

["이용권 발급","결제받은 손님에게 줄 이용권 코드를 만듭니다","/boss.html",9,"z",1],
["도구 모음","작업 순서대로 묶어놓은 기존 작업대","/toolkit.html",9,"z",1],
["캐릭터 만들기","영상·카드뉴스에 쓸 고정 캐릭터","/characters.html",9,"z",1],
["카피 작업대","문구를 다듬어 바로 쓰게 정리합니다","/copy.html",9,"z",1],
["스토어 안내","스마트스토어 판매·안내 문구 모음","/store-guide.html",9,"z",1],
["벤치마크","잘 되는 블로그·글을 뜯어봅니다","/benchmark.html",9,"z",1],
["엔터 뉴스","연예 뉴스·랭킹을 소재로 끌어옵니다","/entertainment.html",9,"z",1],
["링크에서 글 뽑기","주소만 넣으면 본문을 긁어와 소재로 씁니다","/link-content.html",9,"z",1],
["설정","API 키·연결 상태를 한눈에 확인합니다","/setup.html",9,"z",1]
];

var q=document.getElementById("q"), list=document.getElementById("list"),
    rail=document.getElementById("rail"), tally=document.getElementById("tally");
var filter="all", cur=-1, shown=[];

/* 최근 연 도구를 기억합니다. 저장이 막힌 브라우저에서도 화면은 그대로 떠야 합니다. */
function recent(){ try{ return JSON.parse(localStorage.getItem("wsRecent")||"[]"); }catch(e){ return []; } }
function remember(n){
  try{ var r=recent().filter(function(x){return x!==n}); r.unshift(n);
       localStorage.setItem("wsRecent", JSON.stringify(r.slice(0,6))); }catch(e){}
}
function esc(s){ return s.replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function hi(s,k){
  if(!k) return esc(s);
  var i=s.toLowerCase().indexOf(k.toLowerCase());
  if(i<0) return esc(s);
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+k.length))+"</mark>"+esc(s.slice(i+k.length));
}
function pass(t){
  if(filter==="zero") return t[4]==="z" && !t[5];
  if(filter==="credit") return t[4]==="c";
  if(filter==="boss") return !!t[5];
  return true;
}
function rowHTML(t,k){
  var tags='<i class="tag '+(t[4]==="c"?"credit":"zero")+'">'+(t[4]==="c"?"크레딧":"원가 0")+"</i>";
  if(t[5]) tags+=' <i class="tag boss">사장님</i>';
  return '<div class="row" data-h="'+esc(t[2])+'" data-n="'+esc(t[0])+'" data-dead="'+(t[2]?0:1)+'" role="link" tabindex="0">'
    +'<span class="nm">'+hi(t[0],k)+"</span>"+tags
    +'<span class="ds">'+hi(t[1],k)+"</span>"
    +'<span class="go">→</span></div>';
}
function render(){
  var k=q.value.trim(), kl=k.toLowerCase();
  var hits=T.filter(function(t){
    return pass(t) && (!kl || (t[0]+" "+t[1]+" "+G[t[3]]).toLowerCase().indexOf(kl)>=0);
  });
  shown=hits; cur=-1;
  tally.textContent = hits.length===T.length ? T.length+"개" : hits.length+" / "+T.length+"개";

  if(!hits.length){
    list.innerHTML='<div class="rows"><div class="empty"><b>"'+esc(k)+'" 은 없습니다.</b>'
      +'다른 말로 찾아보시거나 거르기를 &lsquo;전체&rsquo;로 되돌리세요.</div></div>';
    rail.innerHTML=""; return;
  }

  var html="", rh="", r=recent();
  /* 검색어도 없고 전체일 때만 최근 목록을 올립니다. 거를 땐 방해가 됩니다. */
  if(!k && filter==="all" && r.length){
    var rec=r.map(function(n){ return T.filter(function(t){return t[0]===n})[0]; }).filter(Boolean);
    if(rec.length){
      html+='<h2 class="g">최근</h2><div class="rows">'+rec.map(function(t){return rowHTML(t,"")}).join("")+"</div>";
    }
  }
  G.forEach(function(g,gi){
    var part=hits.filter(function(t){return t[3]===gi});
    if(!part.length) return;
    html+='<h2 class="g" id="g'+gi+'">'+esc(g)+'</h2><div class="rows">'
        + part.map(function(t){return rowHTML(t,k)}).join("")+"</div>";
    rh+='<button data-g="'+gi+'">'+esc(g)+"<em>"+part.length+"</em></button>";
  });
  list.innerHTML=html; rail.innerHTML=rh;
}
function open(el){
  if(!el) return;
  var h=el.getAttribute("data-h");
  if(!h) return;
  remember(el.getAttribute("data-n"));
  location.href=h;
}
function move(d){
  var els=[].slice.call(list.querySelectorAll(".row"));
  if(!els.length) return;
  if(cur>=0 && els[cur]) els[cur].classList.remove("on");
  cur=(cur+d+els.length)%els.length;
  els[cur].classList.add("on");
  els[cur].scrollIntoView({block:"nearest"});
}

q.addEventListener("input",render);
document.addEventListener("keydown",function(e){
  if(e.key==="/" && e.target!==q){ e.preventDefault(); q.focus(); q.select(); return; }
  if(e.key==="Escape" && e.target===q){ q.value=""; render(); q.blur(); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); move(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); move(-1); }
  else if(e.key==="Enter"){
    var els=list.querySelectorAll(".row");
    if(cur>=0 && els[cur]) open(els[cur]);
    else if(e.target===q && els.length===1) open(els[0]);
  }
});
list.addEventListener("click",function(e){ open(e.target.closest(".row")); });
list.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){ var r=e.target.closest(".row"); if(r){ e.preventDefault(); open(r);} }
});
rail.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var el=document.getElementById("g"+b.getAttribute("data-g"));
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
});
document.querySelectorAll(".chip").forEach(function(c){
  c.addEventListener("click",function(){
    document.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed","false")});
    c.setAttribute("aria-pressed","true");
    filter=c.getAttribute("data-f"); render();
  });
});
render();
</script>
</body>
</html>
