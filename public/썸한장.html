<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:720px;overflow:hidden;position:relative;background:#C8D4E0;
       font-family:"Black Han Sans","Noto Sans KR","Malgun Gothic",sans-serif}
  .sky{position:absolute;inset:0;background:linear-gradient(180deg,#E0E9F3 0%,#F4F8FB 44%,#C8D4E0 60%,#C8D4E0 100%)}
  .bg{position:absolute;left:50%;top:-6%;transform:translateX(-50%);
      width:1126px;opacity:.95}
  .fade{position:absolute;left:0;right:0;bottom:0;z-index:3;
     height:418px;
     background:linear-gradient(180deg,rgba(12,12,14,0) 0%,rgba(12,12,14,.5) 60%,rgba(12,12,14,.85) 100%)}
  .who{position:absolute;left:50%;transform:translateX(-50%);z-index:4;
       bottom:288px;
       display:flex;align-items:flex-end;gap:16px;
       filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
  .cmp{position:absolute;left:16px;right:16px;
       top:6%;z-index:5;
       display:flex;align-items:center;justify-content:space-between}
  .card{background:#111214;border:4px solid #FFE100;border-radius:10px;
       padding:9px 22px;text-align:center;
       box-shadow:0 7px 0 rgba(0,0,0,.55)}
  .card .lb{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:700;
       font-size:21px;color:#C9CDD4;letter-spacing:-.02em;margin-bottom:2px}
  .card b{display:block;font-size:46px;line-height:1.02;color:#fff;letter-spacing:-.03em}
  .card.hot{border-color:#FF2E19} .card.hot b{color:#FF5240}
  .arw{width:69px;height:14px;
       background:#FF2E19;position:relative;transform:rotate(8deg);flex:0 0 auto;
       filter:drop-shadow(0 4px 0 rgba(0,0,0,.55))}
  .arw:after{content:'';position:absolute;right:-13px;top:50%;
       transform:translateY(-50%);border-left:14px solid #FF2E19;
       border-top:14px solid transparent;
       border-bottom:14px solid transparent}
  .up{position:absolute;left:26px;z-index:7;
      bottom:282px;
      font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:38px;
      background:#FFE100;color:#111214;padding:6px 16px;
      border-radius:6px;letter-spacing:-.03em;white-space:nowrap;
      box-shadow:0 5px 0 rgba(0,0,0,.6)}
  .band{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#0C0C0E;
        height:274px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:7px;
        padding:0 18px}
  .band div{font-size:82px;line-height:1.0;letter-spacing:-.05em;white-space:nowrap;
        text-align:center;transform:scaleY(1.08);transform-origin:center}
  .brand{position:absolute;top:13px;right:15px;z-index:8;
     font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:22px;
     background:#111214;color:#FFE100;padding:6px 14px;border-radius:6px;letter-spacing:-.02em;
     border:2px solid #FFE100}
</style>
