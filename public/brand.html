<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브랜드 설정 · 우수리미</title>
<style>
/* 한 번만 정해두면 모든 글에 쓰입니다.
   설정에서 막히는 진짜 이유는 "뭘 더 해야 하는지 모르는 것"이라
   퍼센트와 목록을 맨 위에 둡니다. */
:root { --ink:#24282e; --ink2:#5c6470; --ink3:#98a0ac; --line:#e6e8ec; --brand:#03c75a; }
* { box-sizing: border-box; }
body { margin:0; background:#f5f6f8; color:var(--ink); line-height:1.7;
  font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
header { background:#fff; border-bottom:1px solid var(--line); padding:14px 16px; }
header .row { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
h1 { font-size:17px; margin:0; flex:1; }
.back { font-size:13px; color:var(--ink3); text-decoration:none; }
main { max-width:760px; margin:0 auto; padding:18px 16px 80px; }
.card { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.05); }

/* 완성도 */
.pct-top { display:flex; align-items:baseline; gap:10px; }
.pct-num { font-size:30px; font-weight:800; letter-spacing:-.5px; }
.pct-sub { font-size:13px; color:var(--ink3); }
.bar { height:9px; background:#eef0f3; border-radius:6px; overflow:hidden; margin:12px 0 4px; }
.bar > i { display:block; height:100%; background:var(--brand); border-radius:6px; transition:width .4s; }
.hint { font-size:12.5px; color:var(--ink3); }

/* 다음에 할 것 */
.next { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.next h3 { font-size:13px; margin:0 0 8px; }
.next-item { display:block; width:100%; text-align:left; background:#f7f8fa; border:1px solid var(--line);
  border-radius:9px; padding:10px 12px; margin-bottom:7px; cursor:pointer; font:inherit; color:inherit; }
.next-item:hover { background:#eef1f5; }
.next-item b { font-size:13.5px; }
.next-item span { display:block; font-size:12px; color:var(--ink3); }

/* 항목 */
.grp { font-size:12px; font-weight:700; color:var(--ink3); margin:20px 0 8px; letter-spacing:.3px; }
.item { border-top:1px solid var(--line); padding:13px 0; }
.item:first-of-type { border-top:none; }
.item-head { display:flex; align-items:center; gap:9px; }
.chk { width:17px; height:17px; border-radius:50%; flex:0 0 auto; border:2px solid #d0d5dc; }
.chk.on { background:var(--brand); border-color:var(--brand); position:relative; }
.chk.on::after { content:"✓"; color:#fff; font-size:11px; position:absolute; inset:0; display:grid; place-items:center; }
.item-name { font-size:13.5px; font-weight:600; flex:1; }
.req { font-size:10.5px; background:#fdeceb; color:#a02c2c; padding:1px 7px; border-radius:8px; }
.item-why { font-size:12px; color:var(--ink3); margin:5px 0 0 26px; }
.item-uses { font-size:11px; color:var(--ink3); margin:3px 0 0 26px; }
.item-uses i { font-style:normal; background:#eef1f5; padding:1px 7px; border-radius:7px; margin-right:4px; }
.item-in { margin:9px 0 0 26px; }
input[type=text], textarea, select { width:100%; padding:9px 11px; border:1px solid var(--line);
  border-radius:8px; font:inherit; font-size:13.5px; background:#fff; }
textarea { min-height:64px; resize:vertical; }
input[type=color] { width:52px; height:34px; padding:2px; border:1px solid var(--line); border-radius:8px; background:#fff; }
.color-row { display:flex; align-items:center; gap:9px; }
.color-row code { font-size:12px; color:var(--ink3); }
label.sw { display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }

/* 로고 → 색 뽑기 */
.palette { display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; }
.sw-btn { border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:#fff; cursor:pointer; font:inherit;
  display:flex; align-items:center; gap:6px; font-size:11.5px; }
.sw-btn i { width:18px; height:18px; border-radius:4px; display:block; }
.free { display:inline-block; font-size:11px; background:#e8f6ec; color:#1f6b32; padding:2px 8px; border-radius:8px; }

.savebar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
  padding:11px 16px; display:flex; justify-content:center; }
.savebar > div { max-width:760px; width:100%; display:flex; align-items:center; gap:12px; }
.savebar span { flex:1; font-size:12.5px; color:var(--ink3); }
button.go { background:var(--ink); color:#fff; border:0; border-radius:9px; padding:10px 20px; font:inherit;
  font-weight:600; font-size:13.5px; cursor:pointer; }
button.go:disabled { opacity:.5; cursor:default; }
.muted { font-size:12.5px; color:var(--ink3); }
</style>
</head>
<body>
<header><div class="row">
  <h1>브랜드 설정</h1>
  <a class="back" href="/">← 처음으로</a>
</div></header>

<main>
  <div class="card" id="top">
    <div class="pct-top"><span class="pct-num" id="pct">–</span><span class="pct-sub" id="cnt">불러오는 중…</span></div>
    <div class="bar"><i id="bar" style="width:0"></i></div>
    <p class="hint">한 번만 정해두면 원고·서식·썸네일이 전부 이 설정을 씁니다. <span class="free">AI 안 씀 · 0원</span></p>
    <div class="next" id="next" hidden></div>
  </div>

  <form id="form"></form>
</main>

<div class="savebar"><div>
  <span id="msg">고치신 뒤 저장을 눌러주세요.</span>
  <button class="go" id="save" type="button">저장</button>
</div></div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let state = null;

async function load() {
  const res = await fetch("/api/brand");
  if (res.status === 401) {
    document.querySelector("main").innerHTML =
      '<div class="card"><p>로그인이 필요합니다.</p><p class="muted">브랜드 설정은 계정에 저장됩니다.</p>'
      + '<p><a href="/join.html">로그인하러 가기 →</a></p></div>';
    document.querySelector(".savebar").hidden = true;
    return;
  }
  state = await res.json();
  render();
}

function render() {
  document.getElementById("pct").textContent = state.percent + "%";
  document.getElementById("cnt").textContent = state.done + " / " + state.total + " 채우셨습니다";
  document.getElementById("bar").style.width = state.percent + "%";

  // 다음에 뭘 하면 제일 이득인지. 퍼센트만으론 다음 행동을 모릅니다.
  const nx = document.getElementById("next");
  if (state.next.length) {
    nx.hidden = false;
    nx.innerHTML = "<h3>다음에 이걸 채우시면 좋습니다</h3>" + state.next.map((n) =>
      `<button class="next-item" type="button" data-go="${esc(n.key)}">
         <b>${esc(n.label)}</b><span>${esc(n.why)}</span></button>`).join("");
    nx.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => {
      const el = document.getElementById("row-" + b.dataset.go);
      if (el) { el.scrollIntoView({ behavior:"smooth", block:"center" });
        const inp = el.querySelector("input,textarea,select"); if (inp) setTimeout(() => inp.focus(), 400); }
    });
  } else nx.hidden = true;

  const f = document.getElementById("form");
  f.innerHTML = Object.entries(state.groups).map(([grp, items]) =>
    `<div class="grp">${esc(grp)}</div><div class="card">` +
    items.map((it) => `
      <div class="item" id="row-${esc(it.key)}">
        <div class="item-head">
          <i class="chk ${it.done ? "on" : ""}"></i>
          <span class="item-name">${esc(it.label)}</span>
          ${it.required ? '<span class="req">꼭 필요</span>' : ""}
        </div>
        <p class="item-why">${esc(it.why)}</p>
        ${it.uses ? `<p class="item-uses">${it.uses.map((u) => `<i>${esc(u)}</i>`).join("")}에 쓰입니다</p>` : ""}
        <div class="item-in">${field(it)}</div>
      </div>`).join("") + "</div>").join("");

  wire();
}

function field(it) {
  const v = it.value ?? "";
  const k = esc(it.key);
  if (it.key === "blogId")
    return `<input type="text" value="${esc(v)}" disabled>
            <p class="muted" style="margin:5px 0 0">계정 설정에서 바꿉니다.</p>`;
  if (it.type === "bool")
    return `<label class="sw"><input type="checkbox" data-k="${k}" ${v === true ? "checked" : ""}> 쓰겠습니다</label>`;
  if (it.type === "color")
    return `<div class="color-row">
              <input type="color" data-k="${k}" value="${/^#[0-9a-f]{6}$/i.test(v) ? esc(v) : "#03c75a"}">
              <code data-for="${k}">${esc(v) || "안 정하심"}</code>
            </div>`;
  if (it.type === "image")
    return `<input type="file" accept="image/*" data-logo="${k}">
            <p class="muted" style="margin:5px 0 0">올리면 <b>많이 쓰인 색</b>을 뽑아드립니다. 그림은 저장하지 않습니다.</p>
            <div class="palette" data-palette></div>`;
  if (it.type === "list")
    return `<input type="text" data-k="${k}" data-list="1" value="${esc([].concat(v || []).join(", "))}" placeholder="쉼표로 나눠서">`;
  if (it.type === "text")
    return `<textarea data-k="${k}">${esc(v)}</textarea>`;
  if (it.options)
    return `<select data-k="${k}"><option value="">고르지 않음</option>` +
      it.options.map((o) => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
  return `<input type="text" data-k="${k}" value="${esc(v)}">`;
}

function wire() {
  document.querySelectorAll('input[type=color][data-k]').forEach((el) => {
    el.oninput = () => { const c = document.querySelector(`code[data-for="${el.dataset.k}"]`); if (c) c.textContent = el.value; };
  });
  document.querySelectorAll("[data-logo]").forEach((el) => {
    el.onchange = async () => {
      const box = el.parentElement.querySelector("[data-palette]");
      if (!el.files || !el.files[0]) return;
      box.innerHTML = '<span class="muted">색을 뽑는 중…</span>';
      const fd = new FormData(); fd.append("logo", el.files[0]);
      const r = await fetch("/api/brand/palette", { method:"POST", body: fd }).then((x) => x.json());
      if (!r.ok) { box.innerHTML = `<span class="muted">${esc(r.why || r.error || "색을 못 찾았습니다.")}</span>`; return; }
      // 누르면 브랜드색으로 넣어줍니다. 색코드를 손으로 옮겨 적는 건 일입니다.
      box.innerHTML = r.colors.map((c) =>
        `<button class="sw-btn" type="button" data-hex="${esc(c.hex)}"><i style="background:${esc(c.hex)}"></i>${esc(c.hex)} ${c.percent}%</button>`
      ).join("") + `<span class="muted" style="width:100%">${esc(r.why)} 누르면 브랜드색으로 넣습니다.</span>`;
      box.querySelectorAll("[data-hex]").forEach((b) => b.onclick = () => {
        const t = document.querySelector('input[type=color][data-k="brandColor"]');
        if (t) { t.value = b.dataset.hex; t.dispatchEvent(new Event("input"));
          document.getElementById("msg").textContent = "브랜드색에 넣었습니다. 저장을 눌러주세요."; }
      });
    };
  });
}

document.getElementById("save").onclick = async (e) => {
  const patch = {};
  document.querySelectorAll("[data-k]").forEach((el) => {
    const k = el.dataset.k;
    if (el.type === "checkbox") patch[k] = el.checked;
    else if (el.dataset.list) patch[k] = el.value.split(",").map((s) => s.trim()).filter(Boolean);
    else patch[k] = el.value;
  });
  e.target.disabled = true;
  document.getElementById("msg").textContent = "저장하는 중…";
  try {
    const res = await fetch("/api/brand", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(patch),
    });
    state = await res.json();
    render();
    document.getElementById("msg").textContent =
      state.canWrite ? `저장했습니다. ${state.percent}% 채우셨습니다.`
                     : `저장했습니다. 꼭 필요한 게 ${state.missingRequired.length}개 남았습니다.`;
    document.getElementById("top").scrollIntoView({ behavior:"smooth" });
  } catch {
    document.getElementById("msg").textContent = "저장을 못 했습니다. 잠시 뒤에 다시 해주세요.";
  }
  e.target.disabled = false;
};

load();
</script>
</body>
</html>
