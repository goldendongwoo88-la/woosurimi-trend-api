<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>황금 키워드 찾기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f5f6f8; color: #222; }
  header { background: #fff; padding: 16px; border-bottom: 1px solid #e5e5e5; }
  h1 { font-size: 18px; margin: 0 0 12px 0; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 60px 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  select, button { font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
  select { width: 100%; margin-bottom: 10px; background: #fff; }
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode-btn { flex: 1; padding: 10px; text-align: center; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; color: #666; font-size: 13px; }
  .mode-btn.active { border-color: #03c75a; background: #eafaf1; color: #03c75a; font-weight: bold; }
  button.primary { width: 100%; background: #03c75a; color: #fff; border: none; font-weight: bold; cursor: pointer; }
  button.primary:disabled { background: #bcbcbc; }
  .status { text-align: center; color: #999; padding: 30px 0; font-size: 13px; }

  .ratio-note {
    background: #fff8e1;
    border: 1px solid #ffe08a;
    color: #7a5c00;
    font-size: 13px;
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 6px;
    line-height: 1.6;
  }

  .kw-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .kw-rank {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #eef0ff;
    color: #4a4de0;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
  }
  .kw-card {
    flex: 1;
    min-width: 0;
    background: #fff;
    border: 1px solid #e8e8f2;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .kw-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .kw-title { font-size: 15px; font-weight: bold; color: #222; }
  .kw-score {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: bold;
    color: #03c75a;
    background: #eafaf1;
    padding: 3px 9px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .kw-badges, .kw-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .kw-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 5px;
    background: #eef0ff;
    color: #4a4de0;
    font-weight: bold;
  }
  .kw-badge.volume { background: #e3f2ff; color: #0b74d1; }
  .kw-pill {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    background: #f4f4f6;
    color: #555;
    border: 1px solid #eaeaea;
  }
  .kw-pill b { color: #222; }
  .kw-desc { font-size: 12px; color: #999; line-height: 1.5; }
  .comp-낮음 { color: #03c75a; }
  .comp-중간 { color: #d68f00; }
  .comp-높음 { color: #d33; }
</style>
</head>
<body>
<header><a href="/" style="font-size:13px;color:#888;text-decoration:none;">← 홈으로</a><h1>🔑 황금 키워드 찾기</h1></header>
<main>
  <div class="panel">
    <select id="categorySelect"></select>
    <div class="mode-toggle">
      <div class="mode-btn active" data-mode="all">전체 기간</div>
      <div class="mode-btn" data-mode="today">오늘 발행된 글 기준</div>
    </div>
    <button class="primary" id="searchBtn">검색하기</button>
  </div>
  <div id="result"><div class="status">카테고리를 고르고 검색해 보세요.</div></div>
</main>
<script>
  let mode = "all";
  const select = document.getElementById("categorySelect");
  const resultEl = document.getElementById("result");
  const searchBtn = document.getElementById("searchBtn");

  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.onclick = () => {
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.dataset.mode;
    };
  });

  async function loadCategories() {
    const res = await fetch("/api/categories");
    const data = await res.json();
    select.innerHTML = data.categories.map((c) => `<option value="${c}">${c}</option>`).join("");
  }

  function escapeHtml(str) {
    return (str || "").toString().replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  searchBtn.onclick = async () => {
    const category = select.value;
    searchBtn.disabled = true;
    resultEl.innerHTML = `<div class="status">불러오는 중...</div>`;
    try {
      const res = await fetch(`/api/opportunity?category=${encodeURIComponent(category)}&mode=${mode}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "불러오기 실패");
      if (!data.items.length) {
        resultEl.innerHTML = `<div class="status">결과가 없어요.</div>`;
        return;
      }
      const cards = data.items
        .map(
          (it, i) => `
        <div class="kw-row">
          <div class="kw-rank">${i + 1}</div>
          <div class="kw-card">
            <div class="kw-head">
              <div class="kw-title">${escapeHtml(it.keyword)}</div>
              <div class="kw-score">점수 ${it.opportunityScore}</div>
            </div>
            <div class="kw-badges">
              <span class="kw-badge">네이버 실데이터</span>
              <span class="kw-badge">${escapeHtml(category)}</span>
              <span class="kw-badge volume">검색량 ${it.monthlySearchVolume.toLocaleString()}</span>
            </div>
            <div class="kw-pills">
              <span class="kw-pill">문서수 <b>${escapeHtml(it.blogPostCountLabel)}</b></span>
              <span class="kw-pill">문서/검색 <b>${it.docPerSearch !== null ? it.docPerSearch : "-"}</b></span>
              <span class="kw-pill comp-${escapeHtml(it.competition)}">경쟁도 <b>${escapeHtml(it.competition)}</b></span>
            </div>
            <div class="kw-desc">네이버 검색광고 키워드도구 + 블로그 검색 API로 확인한 실제 검색량·문서수입니다. 문서/검색이 낮을수록 글은 적은데 찾는 사람은 많은 "틈새" 키워드예요.</div>
          </div>
        </div>`
        )
        .join("");
      resultEl.innerHTML = `<div class="ratio-note">💡 <b>문서/검색은 낮을수록 좋아요</b> — 검색하는 사람 수에 비해 이미 올라온 블로그 글이 적다는 뜻이라, 상위노출 경쟁이 덜한 "틈새" 키워드입니다. 반대로 점수(기회점수)는 높을수록 좋아요.</div>${cards}`;
    } catch (err) {
      resultEl.innerHTML = `<div class="status">오류: ${escapeHtml(err.message)} (서버 .env에 네이버 API 키가 채워져 있는지 확인해 주세요)</div>`;
    } finally {
      searchBtn.disabled = false;
    }
  };

  loadCategories();
</script>
</body>
</html>
