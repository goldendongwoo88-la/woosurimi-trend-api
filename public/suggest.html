<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘 뭘 쓸까</title>
<meta name="description" content="지금 사람들이 실제로 검색하는 말을 검색량과 함께 보여줍니다. 오늘 쓸 소재를 여기서 고르세요." />
<meta property="og:type" content="website" />
<meta property="og:title" content="오늘 뭘 쓸까 — 우수리미" />
<meta property="og:description" content="네이버 자동완성과 검색광고 데이터를 합쳐, 지금 검색되는 말을 실제 검색량과 함께 보여줍니다." />
<link rel="stylesheet" href="/assets/ws.css" />
<style>
  .seedbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .seedbar button {
    font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); font-family: inherit;
  }
  .seedbar button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .kw { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line); }
  .kw:last-child { border-bottom: none; }
  .kw .word { font-weight: 600; cursor: pointer; }
  .kw .word:hover { color: var(--brand); }
  .kw .vol { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kw .vol b { font-size: 16px; }
  .g { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .g.gold { background: #fbf1d9; color: #8a6516; }
  .g.green { background: var(--brand-soft); color: var(--brand); }
  .g.red { background: var(--danger-soft); color: var(--danger); }
  .g.gray { background: var(--line); color: var(--ink-3); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="brand" href="/blog-index.html">우수리미<span>.</span></a>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
</div></div>

<div class="wrap">
  <h1>오늘 뭘 쓸까</h1>
  <p class="lede">
    지금 사람들이 <b>실제로 치는 말</b>을 검색량과 함께 보여줍니다.
    네이버 자동완성과 검색광고 데이터를 합쳤습니다.
  </p>

  <div class="card">
    <label>어느 주제로</label>
    <div class="seedbar" id="topics"></div>
    <label for="seed">직접 넣기 <span class="muted">(비워두면 위 주제에서 알아서 고릅니다)</span></label>
    <div class="row">
      <input id="seed" type="text" placeholder="예: 숏컷, 카리나, 금리" autocomplete="off" />
      <button id="go">찾기</button>
    </div>
    <span class="muted" id="quota"></span>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let TOPIC = "패션·미용";

async function loadMe() {
  const r = await fetch("/api/auth/me").then((x) => x.json());
  const k = r.usage?.items?.keyword;
  $("#quota").textContent = k ? `분당 ${k.limit}회까지 쓸 수 있습니다` : "";
  $("#who").innerHTML = r.user
    ? `<span class="pill">${esc(r.usage.planName)}</span><span>${esc(r.user.name)}</span><a href="/homefeed.html">홈피드</a>`
    : `<a href="/join.html">로그인</a>`;
}

async function loadTopics() {
  const d = await fetch("/api/suggest-topics/seeds").then((r) => r.json());
  $("#topics").innerHTML = Object.keys(d.seeds)
    .map((t) => `<button data-topic="${esc(t)}" class="${t === TOPIC ? "on" : ""}">${esc(t)}</button>`).join("");
  $("#topics").querySelectorAll("[data-topic]").forEach((b) =>
    b.addEventListener("click", () => {
      TOPIC = b.dataset.topic;
      $("#topics").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    })
  );
}

$("#go").addEventListener("click", run);
$("#seed").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

async function run() {
  const seed = $("#seed").value.trim();
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="card"><p style="margin:0">네이버에서 모으는 중입니다… 15초쯤 걸립니다.</p></div>`;
  try {
    const res = await fetch("/api/suggest-topics", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(seed ? { seeds: [seed] } : { topic: TOPIC }),
    });
    const d = await res.json();
    if (!res.ok) {
      $("#out").innerHTML = `<div class="card"><div class="msg err">${esc(d.error)}
        ${d.upgrade ? `<a href="${d.upgrade}">요금제 보기</a>` : ""}</div></div>`;
      return;
    }
    render(d);
    loadMe();
  } catch {
    $("#out").innerHTML = `<div class="card"><div class="msg err">연결에 실패했습니다.</div></div>`;
  } finally { $("#go").disabled = false; }
}

function render(d) {
  const withVol = d.items.filter((x) => x.volume != null);
  const noVol = d.items.filter((x) => x.volume == null);

  const row = (x) => `
    <div class="kw">
      <div>
        <div class="word" data-copy="${esc(x.keyword)}" title="눌러서 복사">${esc(x.keyword)}</div>
        <div class="muted">
          ${x.from.join(" · ")}${x.docs != null ? ` · 이미 쓰인 글 ${x.docs.toLocaleString()}건` : ""}
          ${x.advice ? ` · ${esc(x.advice)}` : ""}
        </div>
      </div>
      <div class="vol">${x.volume != null
        ? `<b>${x.volume.toLocaleString()}</b><div class="muted">월 검색</div>`
        : `<span class="muted">검색량 모름</span>`}</div>
      <div>${x.grade ? `<span class="g ${x.tone || "gray"}">${esc(x.grade)}</span>` : ""}</div>
    </div>`;

  $("#out").innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">검색량이 확인된 것 <span class="muted" style="font-size:13px;font-weight:400">${withVol.length}개</span></h2>
      <p class="muted" style="margin-top:-4px">씨앗: ${d.seeds.map(esc).join(", ")}</p>
      ${withVol.length ? withVol.map(row).join("") : `<p class="muted">검색량이 잡힌 것이 없습니다.</p>`}
    </div>

    ${noVol.length ? `<div class="card">
      <h2 style="margin-top:0">자동완성에만 뜬 것 <span class="muted" style="font-size:13px;font-weight:400">${noVol.length}개</span></h2>
      <p class="muted" style="margin-top:-4px">
        검색량은 확인 못 했지만 <b>네이버가 자동완성으로 띄우는 말</b>입니다.
        띄운다는 건 치는 사람이 있다는 뜻입니다.
      </p>
      ${noVol.slice(0, 25).map(row).join("")}
    </div>` : ""}

    <div class="msg">${esc(d.note)}</div>
    ${d.plan === "free" ? `<div class="msg warn">
      무료로는 상위 4개만 문서 수까지 확인합니다. 이용권이 있으면 12개까지 봅니다.
      <a href="/pricing.html">요금제 보기</a></div>` : ""}
  `;
  window.scrollTo({ top: 200, behavior: "smooth" });
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-copy]");
  if (!el) return;
  navigator.clipboard.writeText(el.dataset.copy).then(() => {
    const old = el.textContent;
    el.textContent = "복사됐습니다";
    setTimeout(() => (el.textContent = old), 900);
  }).catch(() => {});
});

loadMe();
loadTopics();
</script>
</body>
</html>
