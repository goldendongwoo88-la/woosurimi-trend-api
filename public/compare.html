<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>경쟁 글 비교</title>
<meta name="description" content="같은 키워드로 나보다 위에 있는 글들이 무엇이 다른지 숫자로 비교합니다." />
<link rel="stylesheet" href="/assets/ws.css" />
<style>
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .vs:last-child { border-bottom: none; }
  .vs .k { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); margin-bottom: -6px; }
  .vs b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .vs .mid { font-size: 11px; color: var(--ink-3); }
  .vs .right { text-align: right; }
  .lo { color: var(--danger); }
  .hi { color: var(--brand); }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="brand" href="/blog-index.html">우수리미<span>.</span></a>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
</div></div>

<div class="wrap">
  <h1>위에 있는 글은 뭐가 다른가요?</h1>
  <p class="lede">같은 키워드로 검색해서 상위 글을 직접 열어보고, 사장님 글과 숫자로 견줍니다.</p>

  <div class="card">
    <label for="keyword">키워드</label>
    <input id="keyword" type="text" placeholder="예: 김포 카페 추천" />
    <div style="height:12px"></div>
    <label for="myUrl">내 글 주소 <span class="muted">(비워두면 상위 글의 공통점만 봅니다)</span></label>
    <input id="myUrl" type="text" placeholder="https://blog.naver.com/아이디/2243..." />
    <div style="height:14px"></div>
    <button id="go">비교하기</button>
    <span class="muted" id="quota" style="margin-left:10px"></span>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadMe() {
  const r = await fetch("/api/auth/me").then((x) => x.json());
  const c = r.usage?.items?.compare;
  $("#quota").textContent = c ? `오늘 ${c.left}/${c.limit}회 남음` : "";
  $("#who").innerHTML = r.user
    ? `<span class="pill">${esc(r.usage.planName)}</span><span>${esc(r.user.name)}</span><a href="/rank.html">순위추적</a>`
    : `<a href="/join.html">로그인</a>`;
}

$("#go").addEventListener("click", run);
async function run() {
  const keyword = $("#keyword").value.trim();
  if (!keyword) return;
  $("#go").disabled = true;
  $("#out").innerHTML = `<div class="card"><p style="margin:0">상위 글을 한 편씩 열어보는 중입니다… 10초쯤 걸립니다.</p></div>`;
  try {
    const res = await fetch("/api/compare", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ keyword, myUrl: $("#myUrl").value.trim() }),
    });
    const d = await res.json();
    if (!res.ok) {
      $("#out").innerHTML = `<div class="card"><div class="msg err">${esc(d.error)}</div>
        ${d.upgrade ? `<a href="${d.upgrade}"><button>요금제 보기</button></a>` : ""}</div>`;
      return;
    }
    render(d);
    loadMe();
  } catch {
    $("#out").innerHTML = `<div class="card"><div class="msg err">연결에 실패했습니다.</div></div>`;
  } finally { $("#go").disabled = false; }
}

function render(d) {
  const b = d.bench, me = d.me;
  const row = (k, mineV, benchV, unit) => {
    if (benchV == null) return "";
    const cls = mineV == null ? "" : mineV < benchV ? "lo" : "hi";
    return `<div class="vs">
      <div class="k">${esc(k)}</div>
      <div><b class="${cls}">${mineV == null ? "—" : mineV.toLocaleString()}</b><span class="muted"> ${unit}</span>
        <div class="muted">내 글</div></div>
      <div class="mid">vs</div>
      <div class="right"><b>${benchV.toLocaleString()}</b><span class="muted"> ${unit}</span>
        <div class="muted">상위 ${d.rivals.length}편 평균</div></div>
    </div>`;
  };

  $("#out").innerHTML = `
    ${me ? `<div class="card">
      <div style="display:flex;align-items:center;gap:12px">
        <div>
          <div class="muted">내 순위</div>
          <div class="score-big">${d.myRank ?? "—"}<span style="font-size:16px;color:var(--ink-3)">${d.myRank ? "위" : ""}</span></div>
        </div>
        <div style="flex:1;font-size:14px;color:var(--ink-2)">
          ${d.myRank ? `"${esc(d.keyword)}"로 검색하면 ${d.myRank}번째에 있습니다.` : `"${esc(d.keyword)}"로는 30위 안에 없습니다.`}
        </div>
      </div>
    </div>` : ""}

    ${d.gaps.length ? `<div class="card">
      <h2 style="margin-top:0">눈에 띄는 차이</h2>
      ${d.gaps.map((g) => `<div class="msg warn"><b>${esc(g.label)}</b> — ${esc(g.text)}</div>`).join("")}
    </div>` : ""}

    <div class="card">
      <h2 style="margin-top:0">숫자로 견주기</h2>
      ${row("글자 수", me?.chars, b.chars, "자")}
      ${row("사진", me?.images, b.images, "장")}
      ${row("소제목(인용구)", me?.headings, b.headings, "개")}
      ${row("제목 길이", me?.titleLength, b.titleLength, "자")}
      ${row("본문 키워드 반복", me?.keywordCount, b.keywordCount, "회")}
      <div class="vs">
        <div class="k">제목에 키워드</div>
        <div><b class="${me?.keywordInTitle ? "hi" : "lo"}">${me == null ? "—" : me.keywordInTitle ? "있음" : "없음"}</b><div class="muted">내 글</div></div>
        <div class="mid">vs</div>
        <div class="right"><b>${b.keywordInTitleRate}%</b><div class="muted">상위 글이 넣음</div></div>
      </div>
      <div class="vs">
        <div class="k">지도</div>
        <div><b class="${me?.hasMap ? "hi" : "lo"}">${me == null ? "—" : me.hasMap ? "있음" : "없음"}</b><div class="muted">내 글</div></div>
        <div class="mid">vs</div>
        <div class="right"><b>${b.mapRate}%</b><div class="muted">상위 글이 넣음</div></div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">비교한 글</h2>
      <div class="scroll-x"><table>
        <tr><th>순위</th><th>글자</th><th>사진</th><th>소제목</th><th>지도</th><th>제목</th></tr>
        ${d.rivals.map((r) => `<tr>
          <td><b>${r.rank}</b></td>
          <td class="num">${r.chars.toLocaleString()}</td>
          <td class="num">${r.images}</td>
          <td class="num">${r.headings ?? "—"}</td>
          <td class="num">${r.hasMap ? "○" : "—"}</td>
          <td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title.slice(0, 34))}</a></td>
        </tr>`).join("")}
      </table></div>
      ${d.failed.length ? `<p class="muted">${d.failed.length}편은 열지 못해 비교에서 뺐습니다.</p>` : ""}
    </div>

    <div class="msg">${esc(d.note)}</div>

    ${d.plan === "free" ? `<div class="msg warn">
      무료로는 상위 ${d.topN}편만 봅니다. 이용권이 있으면 8편까지 보고 하루 여러 번 쓸 수 있습니다.
      <a href="/pricing.html">요금제 보기</a></div>` : ""}
  `;
  window.scrollTo({ top: 200, behavior: "smooth" });
}

loadMe();
</script>
</body>
</html>
