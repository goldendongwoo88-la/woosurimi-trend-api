<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>링크로 콘텐츠 만들기 데모</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  header {
    background: #fff;
    padding: 16px;
    border-bottom: 1px solid #e5e5e5;
  }
  h1 { font-size: 18px; margin: 0; }
  main {
    padding: 16px;
    max-width: 640px;
    margin: 0 auto 60px auto;
  }
  .note {
    background: #fff8e1;
    border: 1px solid #ffe08a;
    color: #7a5c00;
    font-size: 13px;
    padding: 12px 14px;
    margin: 16px 0;
    border-radius: 6px;
    line-height: 1.6;
  }
  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .section-title { font-size: 14px; font-weight: bold; margin: 0 0 10px 0; color: #444; }
  input[type="url"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: #ff7a3d;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button.primary:disabled { background: #bcbcbc; cursor: default; }
  .status { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
  .error { color: #d33; }
  .preview-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .preview-desc { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 10px; }
  .preview-meta { font-size: 12px; color: #999; margin-bottom: 12px; }
  .preview-images { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .preview-images img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
  .action-grid { display: flex; flex-direction: column; gap: 10px; }
  .action-card {
    display: block;
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    text-decoration: none;
    color: #222;
    border: 2px solid transparent;
  }
  .action-card:active { border-color: #ff7a3d; }
  .action-card .emoji { font-size: 24px; margin-bottom: 6px; }
  .action-card .title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .action-card .desc { font-size: 12px; color: #888; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <a href="/" style="font-size:13px;color:#888;text-decoration:none;">← 홈으로</a>
  <h1>우수리미 · 링크로 콘텐츠 만들기 (데모)</h1>
</header>
<main>
  <div class="note">
  블로그·뉴스·상품 페이지 등 <b>링크 하나</b>만 넣으면, 그 페이지의 실제 제목·본문·사진을 먼저 가져와서 보여드려요. 미리보기 확인 후 원하는 형식(블로그 글 / 카드뉴스 / 숏폼 영상)을 고르면, 그 페이지로 넘어가서 <b>실제 내용을 바탕으로</b> 초안을 만들어드려요(빈 주제로 처음부터 지어내는 것보다 훨씬 정확해요).
  </div>

  <div class="panel">
    <div class="section-title">콘텐츠로 만들 링크</div>
    <input type="url" id="urlInput" placeholder="https://blog.naver.com/... 또는 뉴스·상품 페이지 링크" />
    <button class="primary" id="previewBtn">🔍 미리보기 가져오기</button>
  </div>

  <div id="previewResult"></div>
  <div id="actionResult"></div>
</main>

<script>
  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let currentUrl = "";

  document.getElementById("previewBtn").onclick = async () => {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) {
      alert("링크를 먼저 입력해 주세요.");
      return;
    }
    currentUrl = url;
    const btn = document.getElementById("previewBtn");
    btn.disabled = true;
    btn.textContent = "가져오는 중...";
    document.getElementById("previewResult").innerHTML = `<div class="status">페이지에서 제목·본문·사진을 가져오는 중이에요...</div>`;
    document.getElementById("actionResult").innerHTML = "";

    try {
      const res = await fetch(`/api/link-content/preview?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "미리보기 실패");
      renderPreview(data);
      renderActions(url);
    } catch (err) {
      document.getElementById("previewResult").innerHTML = `<div class="panel status error">오류: ${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "🔍 미리보기 가져오기";
    }
  };

  function renderPreview(data) {
    const imagesHtml = data.images.length
      ? `<div class="preview-images">${data.images.map((src) => `<img src="${src}" loading="lazy" />`).join("")}</div>`
      : `<div class="preview-meta">이 페이지에서는 사진을 찾지 못했어요.</div>`;

    document.getElementById("previewResult").innerHTML = `
      <div class="panel">
        <div class="section-title">미리보기</div>
        <div class="preview-title">${escapeHtml(data.title || "(제목을 찾지 못했어요)")}</div>
        ${data.description ? `<div class="preview-desc">${escapeHtml(data.description)}</div>` : ""}
        <div class="preview-meta">본문 글자 수 약 ${data.wordCount.toLocaleString()}자 · 사진 ${data.images.length}장 발견</div>
        ${imagesHtml}
      </div>
    `;
  }

  function renderActions(url) {
    const encoded = encodeURIComponent(url);
    document.getElementById("actionResult").innerHTML = `
      <div class="section-title">어떤 형식으로 만들까요?</div>
      <div class="action-grid">
        <a class="action-card" href="/blog-writer.html?url=${encoded}">
          <div class="emoji">✍️</div>
          <div class="title">블로그 글로 만들기</div>
          <div class="desc">원문 내용을 요약·재구성해서 네이버 블로그 초안(제목+본문)을 만들어요.</div>
        </a>
        <a class="action-card" href="/card-news.html?url=${encoded}">
          <div class="emoji">🗂️</div>
          <div class="title">카드뉴스로 만들기</div>
          <div class="desc">원문 내용으로 페이지별 대본을 짜고, 원문 사진을 배경으로 바로 쓸 수 있어요.</div>
        </a>
        <a class="action-card" href="/shortform.html?url=${encoded}&source=blog">
          <div class="emoji">📱</div>
          <div class="title">숏폼 영상으로 만들기</div>
          <div class="desc">원문 사진·문장으로 장면을 짜고, 실제 mp4 영상까지 만들어요.</div>
        </a>
      </div>
    `;
  }
</script>
</body>
</html>
