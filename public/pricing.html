<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>요금제</title>
<link rel="stylesheet" href="/assets/ws.css" />
<style>
  .plan { position: relative; }
  .plan.rec { border-color: var(--brand); border-width: 2px; }
  .plan.rec::after {
    content: "가장 많이 씁니다"; position: absolute; top: -10px; left: 18px;
    background: var(--brand); color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
  }
  .price { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .price small { font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .cmp td, .cmp th { text-align: center; white-space: nowrap; }
  .cmp td:first-child, .cmp th:first-child { text-align: left; }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <a class="brand" href="/blog-index.html">우수리미<span>.</span></a>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
</div></div>

<div class="wrap">
  <h1>요금제</h1>
  <p class="lede">먼저 무료로 진단해 보시고, 매일 쓰게 되면 그때 이용권을 사세요.</p>

  <div id="plans"></div>

  <h2>무엇이 다른가요</h2>
  <div class="card scroll-x"><table class="cmp" id="cmp"></table></div>

  <h2>이용권 등록</h2>
  <div class="card">
    <p style="margin-top:0;color:var(--ink-2);font-size:14px">
      스마트스토어에서 결제하시면 이용권 코드를 보내드립니다. 아래에 넣으면 바로 적용됩니다.
    </p>
    <div class="row">
      <input id="code" type="text" placeholder="WSU-PRO-1M-..." autocomplete="off" />
      <button id="redeem">등록</button>
    </div>
    <div id="redeemMsg"></div>
  </div>

  <h2>크롬 확장 토큰</h2>
  <div class="card">
    <p style="margin-top:0;font-size:14px;color:var(--ink-2)">
      글쓰기 창에서 <b>홈판 제목</b> 같은 AI 기능을 쓰려면 이 토큰을 확장 설정에 넣어야 합니다.
      도메인이 달라 로그인 정보가 안 넘어가서요.
    </p>
    <button id="tokenBtn">내 토큰 보기</button>
    <div id="tokenOut"></div>
  </div>

  <h2>결제는 어떻게 하나요</h2>
  <div class="card">
    <p style="margin-top:0;font-size:14px;color:var(--ink-2)">
      결제는 <b>네이버 스마트스토어</b>에서 받습니다. 우수리미 서버는 카드번호를 저장하지 않습니다.
      환불도 스마트스토어 규정을 그대로 따릅니다.
    </p>
    <p id="storeLink" style="margin-bottom:0"></p>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => n.toLocaleString() + "원";

async function load() {
  const d = await fetch("/api/plans").then((r) => r.json());
  const me = await fetch("/api/auth/me").then((r) => r.json());

  $("#who").innerHTML = me.user
    ? `<span class="pill">${esc(me.usage.planName)}</span><span>${esc(me.user.name)}</span>`
    : `<a href="/join.html">로그인</a>`;

  $("#plans").innerHTML = d.plans.map((p) => `
    <div class="card plan ${p.recommended ? "rec" : ""}">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <div style="font-size:16px;font-weight:800">${esc(p.name)}</div>
        <div class="price">${p.price === 0 ? "무료" : won(p.price)}
          ${p.price ? "<small>/ 월 · VAT 포함</small>" : ""}</div>
      </div>
      <p style="color:var(--ink-2);font-size:14px;margin:6px 0 12px">${esc(p.blurb)}</p>
      <table>
        <tr><td>블로그 진단</td><td class="num">일 ${p.limits.diagnose.perDay}회</td></tr>
        <tr><td>글 노출·누락 확인</td><td class="num">일 ${p.limits.postCheck.perDay}회</td></tr>
        <tr><td>순위 추적 키워드</td><td class="num">${p.limits.rankKeywords}개</td></tr>
        <tr><td>AI 크레딧</td><td class="num">${p.limits.aiCredits.perDay ? "일 " + p.limits.aiCredits.perDay : "없음"}</td></tr>
      </table>
      ${d.current === p.id ? `<div class="msg ok" style="margin-bottom:0">지금 쓰고 계신 요금제입니다.</div>` : ""}
    </div>`).join("");

  const c = d.comparison;
  $("#cmp").innerHTML =
    `<tr><th></th>${c.plans.map((p) => `<th>${esc(p.name)}</th>`).join("")}</tr>` +
    c.rows.map((r) => `<tr><td>${esc(r.label)}</td>${r.values.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("") +
    c.extras.map((r) => `<tr><td>${esc(r.label)}</td>${r.values.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");

  $("#storeLink").innerHTML = d.storeUrl
    ? `<a href="${esc(d.storeUrl)}" target="_blank" rel="noopener"><button>스마트스토어에서 구매하기</button></a>`
    : `<span class="muted">스마트스토어 상품이 아직 등록되지 않았습니다. 등록 후 이곳에 링크가 뜹니다.</span>`;
}

$("#redeem").addEventListener("click", async () => {
  const code = $("#code").value.trim();
  if (!code) return;
  const res = await fetch("/api/license/redeem", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ code }),
  });
  const d = await res.json();
  if (!res.ok) {
    $("#redeemMsg").innerHTML = `<div class="msg err">${esc(d.error)}
      ${d.login ? `<a href="${d.login}?next=/pricing.html">로그인하기</a>` : ""}</div>`;
    return;
  }
  $("#redeemMsg").innerHTML = `<div class="msg ok">
    <b>${esc(d.user.plan)}</b> 이용권이 적용됐습니다. ${esc(d.user.planUntil.slice(0, 10))}까지 쓰실 수 있습니다.</div>`;
  setTimeout(load, 800);
});

$("#tokenBtn").addEventListener("click", async () => {
  const res = await fetch("/api/auth/token", { method: "POST" });
  const d = await res.json();
  if (!res.ok) {
    $("#tokenOut").innerHTML = `<div class="msg err">${esc(d.error)}
      ${d.login ? `<a href="${d.login}?next=/pricing.html">로그인하기</a>` : ""}</div>`;
    return;
  }
  $("#tokenOut").innerHTML = `
    <div class="msg warn" style="margin-top:12px">
      <b>이건 사실상 비밀번호입니다.</b> 남에게 보여주거나 화면을 캡처해서 올리면
      계정이 통째로 넘어갑니다.
    </div>
    <div style="font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;
                background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;user-select:all">
      ${esc(d.token)}
    </div>
    <button class="ghost small" id="copyTok" style="margin-top:8px">복사</button>
    <p class="muted" style="margin:8px 0 0">
      크롬 → 확장 프로그램 → 우수리미 포스팅 → 옵션 → <b>이용권 토큰</b> 칸에 붙여넣으세요.
    </p>`;
  $("#copyTok").onclick = () => {
    navigator.clipboard.writeText(d.token).then(() => { $("#copyTok").textContent = "복사됐습니다"; });
  };
});

load();
</script>
</body>
</html>
