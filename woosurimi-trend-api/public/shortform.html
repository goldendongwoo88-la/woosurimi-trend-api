<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숏폼 자동 제작 데모</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  header {
    background: #fff;
    padding: 16px;
    border-bottom: 1px solid #e5e5e5;
  }
  h1 { font-size: 18px; margin: 0; }
  main {
    padding: 16px;
    max-width: 640px;
    margin: 0 auto 60px auto;
  }
  .note {
    background: #fff8e1;
    border: 1px solid #ffe08a;
    color: #7a5c00;
    font-size: 13px;
    padding: 12px 14px;
    margin: 16px 0;
    border-radius: 6px;
    line-height: 1.6;
  }
  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    color: #666;
  }
  .tab-btn.active {
    border-color: #03c75a;
    background: #eafaf1;
    color: #03c75a;
    font-weight: bold;
  }
  input[type="url"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: #03c75a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button.primary:disabled { background: #bcbcbc; cursor: default; }
  button.secondary {
    padding: 6px 10px;
    background: #f0f0f0;
    color: #333;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .status { text-align: center; color: #999; font-size: 13px; padding: 20px 0; }
  .error { color: #d33; }
  .scene-card {
    display: flex;
    gap: 12px;
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .scene-thumb {
    flex: 0 0 auto;
    width: 90px;
    height: 90px;
    border-radius: 8px;
    background: #eee;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #bbb;
  }
  .scene-body { flex: 1; min-width: 0; }
  .scene-role {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .scene-role.hook { background: #ffe3e3; color: #d33; }
  .scene-role.body { background: #eafaf1; color: #03c75a; }
  .scene-role.cta { background: #e3edff; color: #2563eb; }
  .scene-caption { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .scene-actions { margin-top: 8px; }
  .hashtags { font-size: 13px; color: #555; margin-top: 4px; line-height: 1.8; }
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .section-title { font-size: 14px; font-weight: bold; margin: 18px 0 8px 0; color: #444; }
  .toolbar { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <a href="/" style="font-size:13px;color:#888;text-decoration:none;">← 홈으로</a>
  <h1>우수리미 · 숏폼 자동 제작 (데모)</h1>
</header>
<main>
  <div class="note">
링크 속 <b>실제 사진과 본문 문장</b>을 가져와서 장면(씬)별 기획안(대본)을 자동으로 짜고, 아래에서 <b>실제 mp4 영상 파일</b>까지 만들 수 있어요(사진 슬라이드 + 자막 + 선택한 배경음악). 다만 아직 AI 성우 음성이나 이미지 확대·축소 애니메이션이 들어간 "고급" 버전은 아니고, 고정된 템플릿 하나로 만드는 단순한 버전입니다. 사진과 문장은 AI가 지어낸 게 아니라 원문 페이지에서 그대로 가져온 것입니다.
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab-btn active" data-source="blog">블로그 링크</div>
      <div class="tab-btn" data-source="shopping">쇼핑 커넥트 링크</div>
    </div>
    <input type="url" id="urlInput" placeholder="https://blog.naver.com/... 링크를 붙여넣어 주세요" />
    <button class="primary" id="generateBtn">숏폼 기획안 생성하기</button>
  </div>

  <div id="result"></div>
</main>

<script>
  let currentSource = "blog";
  const tabs = document.querySelectorAll(".tab-btn");
  const urlInput = document.getElementById("urlInput");
  const generateBtn = document.getElementById("generateBtn");
  const resultEl = document.getElementById("result");

  tabs.forEach((tab) => {
    tab.onclick = () => {
      tabs.forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      currentSource = tab.dataset.source;
      urlInput.placeholder =
        currentSource === "shopping"
          ? "https://smartstore.naver.com/... 같은 상품 페이지 링크를 붙여넣어 주세요"
          : "https://blog.naver.com/... 링크를 붙여넣어 주세요";
    };
  });

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      alert("이 브라우저는 음성 읽기를 지원하지 않아요. 크롬 최신 버전을 이용해 보세요.");
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ko-KR";
    window.speechSynthesis.speak(utter);
  }

  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderResult(plan) {
    const roleLabel = { hook: "오프닝 후킹", body: "본문", cta: "마무리 CTA" };
    const sceneHtml = plan.scenes
      .map(
        (s) => `
      <div class="scene-card">
        <div class="scene-thumb" style="${s.image ? `background-image:url('${s.image}')` : ""}">${s.image ? "" : "🖼️"}</div>
        <div class="scene-body">
          <span class="scene-role ${s.role}">씬 ${s.index} · ${roleLabel[s.role] || s.role}</span>
          <div class="scene-caption">${escapeHtml(s.caption)}</div>
          <div class="scene-actions">
            <button class="secondary" onclick='speak(${JSON.stringify(s.caption)})'>🔊 음성으로 듣기(무료 브라우저 TTS)</button>
          </div>
        </div>
      </div>`
      )
      .join("");

    resultEl.innerHTML = `
      <div class="panel">
        <div class="section-title">원문 제목</div>
        <div>${escapeHtml(plan.sourceTitle || "(제목을 찾지 못했어요)")}</div>
        ${plan.price ? `<div style="margin-top:6px;color:#d33;font-weight:bold;">가격: ${escapeHtml(plan.price)}</div>` : ""}
        <div class="section-title">해시태그</div>
        <div class="hashtags">${plan.hashtags.map((h) => escapeHtml(h)).join(" ")}</div>
      </div>

      <div class="section-title">장면별 기획안 (사진 ${plan.imagesFound}장 발견됨)</div>
      ${sceneHtml}

      <div class="panel">
        <div class="section-title" style="margin-top:0;">전체 대본 (복사해서 쓰세요)</div>
        <textarea readonly id="fullScript">${escapeHtml(plan.fullScript)}</textarea>
        <div class="toolbar">
          <button class="secondary" onclick="copyScript()">📋 대본 복사</button>
          <button class="secondary" onclick='speak(${JSON.stringify(plan.fullScript.replace(/\[씬 \d+\]/g, ""))})'>🔊 전체 듣기</button>
        </div>
      </div>

      <div class="note">${escapeHtml(plan.note)}</div>

      <div class="panel">
        <div class="section-title" style="margin-top:0;">🎬 영상 파일(mp4)로 만들기</div>
        <div class="note" style="margin:0 0 12px 0;">고정 템플릿 버전이에요 — 사진 슬라이드 + 자막 + (선택)배경음악만 들어갑니다. AI 성우 음성이나 확대·축소 애니메이션은 아직 없어요.</div>
        <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;">배경음악(mp3, 선택사항)</label>
        <input type="file" id="bgmInput" accept="audio/*" style="margin-bottom:10px;width:100%;" />
        <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;">장면당 길이(초)</label>
        <input type="number" id="durationInput" value="3" min="2" max="6" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;" />
        <button class="primary" id="renderBtn">영상 생성하기</button>
        <div id="renderResult" style="margin-top:14px;"></div>
      </div>
    `;

    document.getElementById("renderBtn").onclick = () => renderVideo(plan.scenes);
  }

  async function renderVideo(scenes) {
    const renderBtn = document.getElementById("renderBtn");
    const renderResultEl = document.getElementById("renderResult");
    const bgmInput = document.getElementById("bgmInput");
    const durationInput = document.getElementById("durationInput");

    renderBtn.disabled = true;
    renderBtn.textContent = "영상 만드는 중... (몇십 초 걸릴 수 있어요)";
    renderResultEl.innerHTML = "";

    const form = new FormData();
    form.append("scenes", JSON.stringify(scenes));
    form.append("durationPerScene", durationInput.value || "3");
    if (bgmInput.files[0]) form.append("bgm", bgmInput.files[0]);

    try {
      const res = await fetch("/api/shortform/render", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "영상 생성 실패");
      renderResultEl.innerHTML = `
        <video controls style="width:100%;border-radius:8px;background:#000;" src="${data.publicPath}"></video>
        <div class="toolbar">
          <a href="${data.publicPath}" download class="secondary" style="text-decoration:none;display:inline-block;">⬇️ 다운로드</a>
        </div>
      `;
    } catch (err) {
      renderResultEl.innerHTML = `<div class="status error">오류: ${escapeHtml(err.message)}</div>`;
    } finally {
      renderBtn.disabled = false;
      renderBtn.textContent = "영상 생성하기";
    }
  }

  function copyScript() {
    const ta = document.getElementById("fullScript");
    ta.select();
    document.execCommand("copy");
    alert("대본을 복사했어요!");
  }

  generateBtn.onclick = async () => {
    const url = urlInput.value.trim();
    if (!url) {
      alert("링크를 먼저 입력해 주세요.");
      return;
    }
    generateBtn.disabled = true;
    generateBtn.textContent = "만드는 중...";
    resultEl.innerHTML = `<div class="status">페이지에서 사진·본문을 가져오는 중이에요...</div>`;
    try {
      const res = await fetch("/api/shortform/plan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, source: currentSource }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "생성 실패");
      renderResult(data);
    } catch (err) {
      resultEl.innerHTML = `<div class="status error">오류: ${escapeHtml(err.message)}</div>`;
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "숏폼 기획안 생성하기";
    }
  };
</script>
</body>
</html>
