<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af;
    --line:#e5e7eb; --bg:#fff; --soft:#f7f8fa; --brand:#4f46e5;
  }
  * { box-sizing: border-box; }
  body {
    width: 360px; margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 13px;
  }
  header {
    padding: 14px 16px; background: linear-gradient(135deg,#2f6fd0,#4f46e5); color:#fff;
  }
  header b { font-size: 14px; letter-spacing: -.2px; }
  header p { margin: 4px 0 0; font-size: 11px; opacity: .85; line-height: 1.5; }
  main { padding: 14px 16px 12px; }

  label { display:block; font-size:11.5px; font-weight:600; color:var(--ink2); margin:10px 0 5px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-size:12.5px; font-family:inherit; color:var(--ink); background:#fff;
  }
  input:focus, select:focus, textarea:focus {
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,70,229,.12);
  }
  textarea { min-height: 90px; resize: vertical; line-height:1.6; }

  .go {
    width:100%; margin-top:12px; padding:11px; border:0; border-radius:8px; cursor:pointer;
    background:var(--brand); color:#fff; font-weight:700; font-size:13px; font-family:inherit;
  }
  .go:hover { filter:brightness(1.08); }
  .go:disabled { background:#b4b8d8; cursor:default; }
  .ghost {
    padding:10px; border:1px solid var(--line); border-radius:8px; cursor:pointer;
    background:#fff; color:var(--ink2); font-weight:600; font-size:12.5px; font-family:inherit;
  }
  .btns { display:flex; gap:6px; margin-top:9px; }
  .btns > * { flex:1; }

  .tabs { display:flex; gap:5px; margin-bottom:12px; }
  .tab {
    flex:1; padding:7px 4px; font-size:11.5px; cursor:pointer; font-family:inherit;
    border:1px solid var(--line); background:var(--soft); color:#5b6472; border-radius:8px;
  }
  .tab.on { background:#eef2ff; border-color:#c7d2fe; color:#3730a3; font-weight:700; }
  .hide { display:none !important; }

  .msg { margin-top:11px; font-size:11.5px; line-height:1.65; border-radius:8px; }
  .msg:empty { display:none; }
  .msg.info { padding:9px 11px; background:#f3f4f6; color:var(--ink2); }
  .msg.wait { padding:9px 11px; background:#fef9e7; color:#8a6112; }
  .msg.good { padding:9px 11px; background:#eaf7ef; color:#1e6b3f; }
  .msg.bad  { padding:9px 11px; background:#fdeceb; color:#9b2c23; }

  .result { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .rt { font-weight:700; font-size:12.5px; line-height:1.5; }
  .rm { font-size:11px; color:var(--ink3); margin-top:4px; }
  .prev {
    margin-top:9px; max-height:150px; overflow-y:auto; padding:10px 12px;
    background:var(--soft); border-radius:8px; font-size:11.5px; line-height:1.75; color:#374151;
  }
  .prev h4 { margin:10px 0 4px; font-size:11.5px; color:var(--ink); }
  .prev h4:first-child { margin-top:0; }
  .prev p { margin:0 0 7px; }
  .tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px; }
  .tags span { font-size:10.5px; background:#eef2ff; color:#4338ca; padding:3px 7px; border-radius:5px; }

  footer {
    padding:10px 16px; border-top:1px solid #f0f1f3; font-size:10.5px; color:var(--ink3);
    display:flex; justify-content:space-between; align-items:center; line-height:1.5;
  }
  footer a { color:var(--brand); text-decoration:none; }
</style>
</head>
<body>
  <header>
    <b>우수리미 포스팅</b>
    <p>주제만 넣으면 원고가 나오고, 네이버 글쓰기 창에 바로 들어갑니다.</p>
  </header>

  <main>
    <div class="tabs">
      <button class="tab on" data-mode="topic">주제로 쓰기</button>
      <button class="tab" data-mode="product">상품 링크</button>
      <button class="tab" data-mode="kw">키워드 찾기</button>
    </div>

    <div class="pane" data-pane="topic">
      <label for="topic">무엇에 대해 쓸까요</label>
      <input id="topic" placeholder="예: 제주도 애월 카페 추천" autocomplete="off">
      <label for="kw">노리는 키워드 <span style="font-weight:400;color:var(--ink3)">(선택)</span></label>
      <input id="kw" placeholder="예: 애월 카페" autocomplete="off">
      <label for="tone">글 성격</label>
      <select id="tone">
        <option value="후기형">후기형 — 직접 겪은 이야기</option>
        <option value="정보형">정보형 — 알려주는 글</option>
        <option value="추천형">추천형 — 여러 개 비교</option>
        <option value="일상형">일상형 — 편한 이야기</option>
      </select>
      <button class="go" id="write">✍️ 원고 만들기</button>
    </div>

    <div class="pane hide" data-pane="product">
      <label for="purl">상품 링크</label>
      <input id="purl" placeholder="네이버 쇼핑·스마트스토어·쿠팡 링크" autocomplete="off">
      <label for="pnote">직접 써보신 점 <span style="font-weight:400;color:var(--ink3)">(있으면 훨씬 좋아집니다)</span></label>
      <textarea id="pnote" placeholder="예: 손잡이가 미끄럽지 않아서 좋았고, 뚜껑 여닫는 게 뻑뻑함"></textarea>
      <button class="go" id="prodgo">🛒 리뷰 원고 만들기</button>
    </div>

    <div class="pane hide" data-pane="kw">
      <label for="seed">기준 키워드 하나</label>
      <input id="seed" placeholder="예: 제주도 카페" autocomplete="off">
      <button class="go" id="kwgo">🔍 연관 키워드 찾기</button>
      <div id="kwout"></div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="result hide" id="result">
      <div class="rt" id="rtitle"></div>
      <div class="rm" id="rmeta"></div>
      <div class="prev" id="rprev"></div>
      <div class="tags" id="rtags"></div>
      <div class="btns">
        <button class="go" id="send" style="margin-top:0">네이버에 넣기</button>
        <button class="ghost" id="copy">복사</button>
      </div>
    </div>
  </main>

  <footer>
    <span>발행은 직접 눌러주세요</span>
    <a href="#" id="opt">설정</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
